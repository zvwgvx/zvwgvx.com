name: Website smoke test

on:
  push:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Start preview and verify pages
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            sleep 1
          done
          routes=("/" "/work/" "/work/aelia/" "/work/rift/" "/work/lattice/" "/work/9router/" "/work/opusmc/" "/writing/" "/writing/about-this-notebook/" "/about/" "/cv/" "/updates/")
          for route in "${routes[@]}"; do
            code=$(curl -s -o /tmp/website-response.html -w "%{http_code}" "http://127.0.0.1:4321${route}")
            expected=200
            if [ "$code" != "$expected" ]; then
              echo "FAIL $route: HTTP $code, expected $expected"
              cat /tmp/astro-preview.log
              exit 1
            fi
            echo "PASS $route: HTTP $code"
          done
          test -f dist/404.html
          grep -q "Page not found" dist/404.html
          curl -fsS http://127.0.0.1:4321/ | grep -q "Vu Truong Giang"
          curl -fsS http://127.0.0.1:4321/work/aelia/ | grep -q "Cognitive architecture"
          curl -fsS http://127.0.0.1:4321/cv/ | grep -q "Curriculum vitae"
          curl -fsS http://127.0.0.1:4321/ | grep -q 'data-theme="dark"'
          curl -fsS http://127.0.0.1:4321/cv/ | grep -q "codeforces.com/profile/zvwg.vx"
          curl -fsS http://127.0.0.1:4321/cv/ | grep -q "Sep 2025"
          curl -fsS http://127.0.0.1:4321/updates/ | grep -q "Nov 2025"
          curl -fsS http://127.0.0.1:4321/updates/ | grep -q "First Prize — Provincial Informatics Excellent Student Competition (VOI Team Selection)"
          curl -fsS http://127.0.0.1:4321/cv/ | grep -q "Consolation Prize — Provincial Informatics Excellent Student Competition (VOI Team Selection)"
      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install chromium --with-deps
      - name: Capture desktop and mobile previews
        shell: bash
        run: |
          mkdir -p screenshots
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          npx --yes playwright@1.56.1 screenshot --browser chromium --full-page --viewport-size "1440,900" http://127.0.0.1:4321/ screenshots/home-desktop.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --full-page --viewport-size "390,844" http://127.0.0.1:4321/ screenshots/home-mobile.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --full-page --viewport-size "1440,900" http://127.0.0.1:4321/work/aelia/ screenshots/aelia-desktop.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-preview-screenshots
          path: screenshots/
          if-no-files-found: ignore
